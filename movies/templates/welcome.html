<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="view" content="width=device-width, initial-scale=1.0" />
        <title>MyMDB</title>
    </head>
    <body>
        <h1>MyMDB - The Movie Database to trust!</h1> 
        <form action="{% url 'add_movie' %}" method="post">
            {% csrf_token %}
        <button type="submit">Add</button>
        <input type="text" name="movie_name" placeholder="Movie name">
        <input type="number" name="release_year" placeholder="Release Year">
        <input type="text" name="genre" placeholder="Genre">
        <input type="checkbox" name="Available">
        <label for="Available">Is Available</label>
        </form>
        {% for movie in movies %}
        <form action="{% url 'delete_movie' %}" method="delete">
            <input type="hidden" name="id" value={{movie.id}} />
            <h2>{{ movie.name }}</h2>
            <span>{{ movie.release_year }}</span>
            <span>{{ movie.genre }}</span>
            {% if movie.is_available %}
                <span>available</span>
            {% else %}
                <span>taken</span>
            {% endif %} 
            <button type ="submit">Delete</button>
        </form>
        {% endfor %}
    </body>
</html>
